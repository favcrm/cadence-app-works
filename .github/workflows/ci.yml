name: scaffold

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check scaffold and sources
        run: node scripts/check-scaffold.mjs
      - name: Test read-only content
        run: node --test tests/*.test.mjs
